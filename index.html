
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagen del Espacio</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0d19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            text-align: center;
            max-width: 800px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 15px;
            letter-spacing: 1px;
            color: #cdd6f4;
        }

        .space-img {
            width: 100%;
            max-height: 500px;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        p {
            font-size: 0.95rem;
            color: #a6adc8;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Maravillas del Universo</h1>
        <!-- Imagen de ejemplo del telescopio James Webb / espacio profundo -->
        <img src="https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?auto=format&fit=crop&w=1200&q=80" alt="Nebulosa en el espacio profundo" class="space-img">
        <p>Una impresionante vista de estrellas y nebulosas capturada en el vasto espacio exterior.</p>
    </div>

</body>
</html>
